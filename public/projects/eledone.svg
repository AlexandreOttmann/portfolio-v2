<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Placeholder visual for Eledone (no product screenshot yet). Eledone is also an octopus genus. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2040"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5b6cff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#40e0d0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0080"/>
      <stop offset="0.35" stop-color="#ff8c00"/>
      <stop offset="0.65" stop-color="#40e0d0"/>
      <stop offset="1" stop-color="#9370db"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- abstract octopus: a head and eight tentacles flowing like data streams -->
  <g transform="translate(420 330) scale(-1 1)" fill="none" stroke="url(#ink)" stroke-linecap="round">
    <ellipse cx="0" cy="-70" rx="120" ry="135" stroke-width="5" opacity="0.9"/>
    <circle cx="-42" cy="-60" r="9" fill="#fff" stroke="none"/>
    <circle cx="42" cy="-60" r="9" fill="#fff" stroke="none"/>
    <g stroke-width="6" opacity="0.85">
      <path d="M-95 20 C -180 120, -260 120, -300 230 S -250 380, -330 430"/>
      <path d="M-65 50 C -120 160, -170 220, -160 320 S -110 430, -170 500"/>
      <path d="M-30 62 C -50 180, -80 260, -40 360 S 10 450, -20 520"/>
      <path d="M0 66 C 10 190, 30 270, 70 350 S 90 470, 60 530"/>
      <path d="M30 62 C 70 170, 120 240, 170 300 S 210 420, 190 500"/>
      <path d="M65 50 C 130 140, 200 190, 270 230 S 330 360, 320 430"/>
      <path d="M95 20 C 180 90, 260 100, 330 130 S 400 250, 420 300"/>
      <path d="M-110 -10 C -200 40, -300 20, -380 80"/>
    </g>
    <g fill="#fff" stroke="none" opacity="0.7">
      <circle cx="-300" cy="230" r="5"/><circle cx="-160" cy="320" r="5"/><circle cx="-40" cy="360" r="5"/>
      <circle cx="70" cy="350" r="5"/><circle cx="170" cy="300" r="5"/><circle cx="270" cy="230" r="5"/>
      <circle cx="330" cy="130" r="5"/><circle cx="-380" cy="80" r="5"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#ffffff" text-anchor="end">
    <text x="1480" y="400" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="150" letter-spacing="-2">Eledone</text>
    <text x="1474" y="470" font-size="34" fill-opacity="0.75">AI agents for B2B sales operations</text>
    <text x="1474" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill-opacity="0.5" letter-spacing="2">OCR + LLM  →  ERP MATCHING  ·  SOFTWARE FACTORY</text>
    <text x="1474" y="780" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill-opacity="0.4" letter-spacing="2">AI PLATFORM ENGINEER · 2026 — TODAY</text>
  </g>
